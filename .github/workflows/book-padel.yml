name: Book Padel Courts

on:
  schedule:
    # Runs every day at 00:00 CEST (22:00 UTC).
    - cron: '0 22 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run booking script
        run: node scripts/book.js
        env:
          PLAYER_NUMBER: ${{ secrets.PLAYER_NUMBER }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SECOND_PLAYER: ${{ secrets.SECOND_PLAYER }}
          CARD_HOLDER: ${{ secrets.CARD_HOLDER }}
          CARD_NUMBER: ${{ secrets.CARD_NUMBER }}
          CARD_EXPIRY: ${{ secrets.CARD_EXPIRY }}
