name: Book Padel Courts

on:
  schedule:
    # Runs every day at 10:40 CEST (8:40 UTC).
    - cron: '40 8 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-18-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Playwright browsers (chromium only)
        id: cache-playwright-browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install Playwright chromium browser
        if: steps.cache-playwright-browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run booking script
        run: node scripts/book.js
        env:
          PLAYER_NUMBER: ${{ secrets.PLAYER_NUMBER }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SECOND_PLAYER: ${{ secrets.SECOND_PLAYER }}
          CARD_HOLDER: ${{ secrets.CARD_HOLDER }}
          CARD_NUMBER: ${{ secrets.CARD_NUMBER }}
          CARD_EXPIRY: ${{ secrets.CARD_EXPIRY }}
