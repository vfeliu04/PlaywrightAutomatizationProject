name: Book Padel Courts

on:
  schedule:
    # Runs every day at 10:40 CEST (8:40 UTC).
    - cron: '40 8 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        if: steps.setup-node.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Playwright browsers
        id: cache-playwright-browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.cache-playwright-browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Run booking script
        run: node scripts/book.js
        env:
          PLAYER_NUMBER: ${{ secrets.PLAYER_NUMBER }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SECOND_PLAYER: ${{ secrets.SECOND_PLAYER }}
          CARD_HOLDER: ${{ secrets.CARD_HOLDER }}
          CARD_NUMBER: ${{ secrets.CARD_NUMBER }}
          CARD_EXPIRY: ${{ secrets.CARD_EXPIRY }}
